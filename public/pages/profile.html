<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional profile | LocalHire</title>
    <meta name="theme-color" content="#5b3df5">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/comm.css">
</head>
<body class="lh">
    <div id="lh-header"></div>

    <main id="main" class="lh-main">
        <div class="lh-container" style="padding-top:16px">
            <a class="lh-link" id="back-link" href="category.html">← Back to results</a>
            <div id="profile-root" aria-live="polite">
                <div class="lh-card lh-p-head" style="margin-top:12px" aria-hidden="true">
                    <span class="sk sk-circle" style="width:96px;height:96px"></span>
                    <div style="flex:1"><div class="sk sk-line" style="width:50%;height:22px"></div><div class="sk sk-line" style="width:30%"></div><div class="sk sk-line" style="width:40%"></div></div>
                </div>
            </div>
        </div>
    </main>

    <div id="bookbar-root"></div>
    <div id="lh-bottom"></div>

    <!-- Booking request sheet -->
    <div class="lh-overlay" id="book-overlay">
        <div class="lh-sheet" role="dialog" aria-modal="true" aria-labelledby="book-title" id="book-sheet"></div>
    </div>
    <div class="lh-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Portfolio photo"><img alt="" id="lightbox-img"></div>

    <script src="../js/data.js"></script>
    <script src="../js/geo.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/marketplace.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
    (async () => {
        const $ = (s, r) => (r || document).querySelector(s);
        const esc = LH.esc;
        const u = LH.user();
        LH.renderHeader($('#lh-header'), { active: 'browse' });
        LH.renderBottomNav($('#lh-bottom'), 'browse');
        await LH.location.restore();

        const isWorker = u && u.role === 'Worker';
        const isAdmin = u && u.role === 'Admin';
        const root = $('#profile-root');
        $('#back-link').href = isWorker ? 'worker-dashboard.html' : (u ? 'category.html' : '../index.html');
        $('#back-link').textContent = isWorker ? '← Back to Worker Hub' : '← Back to results';

        const params = new URLSearchParams(window.location.search);
        const workerId = params.get('id');
        const notFound = (title, text) => { root.innerHTML = `<div style="margin-top:16px">${LH.stateBox({ icon: 'users', title, text, action: `<a class="lh-btn lh-btn-primary" href="${u ? 'customer-home.html' : '../index.html'}">Find another professional</a>` })}</div>`; };
        if (!workerId) { notFound('Professional not found', 'The link is missing a professional.'); return; }

        let worker;
        try {
            worker = (await LH.data.worker(workerId)).worker;
        } catch (e) {
            if (e.status === 404) notFound('This professional is not available', 'They may not be verified yet, or the profile no longer exists.');
            else root.innerHTML = `<div style="margin-top:16px">${LH.stateBox({ icon: 'users', error: true, title: 'We could not load this profile', text: e.message, action: '<button class="lh-btn lh-btn-ghost" type="button" onclick="location.reload()">Try again</button>' })}</div>`;
            return;
        }
        document.title = `${worker.name} · ${worker.category} | LocalHire`;
        if (u && u.role === 'Customer' && worker.isVerified) LH.recent.add(worker.id);

        const isSelf = u && u.id === worker.id;
        const canBook = u && u.role === 'Customer' && worker.isVerified;

        // ── Page body ─────────────────────────────────────────────────────────
        const today = new Date().getDay();
        const hoursHtml = (worker.workingHours && worker.workingHours.length)
            ? `<div class="lh-hours">${worker.workingHours.map((h) => `<span class="${h.dayOfWeek === today ? 'today' : ''}">${LH.dayName[h.dayOfWeek]}${h.dayOfWeek === today ? ' (today)' : ''}</span><span class="${h.dayOfWeek === today ? 'today' : ''}">${esc(h.startTime)} – ${esc(h.endTime)}</span>`).join('')}</div>`
            : '<p class="lh-help">This professional has not published working hours. Pick a time in your request and they will confirm it.</p>';

        const priceBlock = () => {
            const rows = [];
            if (worker.hourlyRate > 0) rows.push(['Hourly rate', `${LH.money(worker.hourlyRate)}/hr`]);
            if (worker.startingCharge > 0) rows.push(['Visit / starting charge', LH.money(worker.startingCharge)]);
            if (!rows.length) return '<p class="lh-help">This professional has not listed a price. Send a request with your proposed price and they will respond.</p>';
            return `<dl class="lh-summary" style="grid-template-columns:200px 1fr">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd><strong>${esc(v)}</strong></dd>`).join('')}</dl>
                <p class="lh-help" style="margin-top:10px">Prices are set by the professional. The final amount is agreed with them; nothing is charged when you send a request.</p>`;
        };

        const portfolioHtml = (worker.portfolio && worker.portfolio.length)
            ? `<div class="lh-gallery">${worker.portfolio.map((p, i) => `<button type="button" data-i="${i}" aria-label="View photo ${i + 1}${p.caption ? ': ' + esc(p.caption) : ''}"><img src="${esc(p.url)}" alt="${esc(p.caption || 'Work by ' + worker.name)}" loading="lazy"></button>`).join('')}</div>`
            : '<p class="lh-help">This professional has not added portfolio photos yet.</p>';

        const bookPanel = (variant) => {
            const price = worker.startingPrice !== null ? `<div class="lh-price" style="margin-bottom:4px">From ${LH.money(worker.startingPrice)}<small>${worker.priceUnit === 'visit' ? ' visit charge' : '/hr'}</small></div>` : '';
            let action;
            if (isSelf) action = '<a class="lh-btn lh-btn-ghost lh-btn-block" href="edit-profile.html">Edit my profile</a>';
            else if (isWorker) action = '<p class="lh-help">Worker accounts can\'t book other professionals. Use a customer account to hire.</p>';
            else if (isAdmin) action = '<p class="lh-help">Admin preview. Bookings are made from customer accounts.</p>';
            else if (!u) action = '<a class="lh-btn lh-btn-primary lh-btn-block" href="auth.html">Sign in to book</a>';
            else if (!worker.isVerified) action = '<div class="lh-alert warn">Not available for new bookings. This professional is not currently verified. Your existing bookings are not affected.</div>';
            else action = '<button class="lh-btn lh-btn-primary lh-btn-block" type="button" data-book>Book now</button>';
            return `<aside class="lh-card lh-book-panel ${variant}" aria-label="Booking">
                ${price}<div style="margin:6px 0 12px">${LH.availabilityPill(worker)}</div>${action}
                ${canBook ? `<button class="lh-btn lh-btn-ghost lh-btn-block" type="button" id="btn-fav" style="margin-top:8px"></button>
                <a class="lh-btn lh-btn-ghost lh-btn-block" style="margin-top:8px" href="chat.html?userId=${encodeURIComponent(worker.id)}">Message</a>` : ''}
                <ul class="lh-help" style="list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px">
                    <li>✓ Identity verified by LocalHire</li><li>✓ No payment is taken when you send a request</li><li>✓ Ratings only from completed bookings</li></ul></aside>`;
        };

        root.innerHTML = `
            <div class="lh-card lh-p-head" style="margin-top:12px">
                ${LH.avatar(worker, 104)}
                <div style="min-width:0;flex:1">
                    <h1 class="display">${esc(worker.name)}${worker.isVerified ? LH.verifiedBadge() : ''}</h1>
                    <div class="lh-wsub" style="font-size:16px">${esc(worker.category)}${worker.additionalCategories && worker.additionalCategories.length ? ' · also ' + esc(worker.additionalCategories.join(', ')) : ''}</div>
                    <div style="margin:6px 0" id="head-rating">${LH.ratingHtml(worker)}</div>
                    <div class="lh-meta"><span>${LH.icon('clock')}${esc(LH.experienceText(worker))}</span>
                        ${worker.serviceArea ? `<span>${LH.icon('pin')}${esc(worker.serviceArea)}${worker.serviceRadiusKm ? ' · travels up to ' + Number(worker.serviceRadiusKm) + ' km' : ''}</span>` : ''}</div>
                </div>
            </div>
            <div class="lh-profile-layout">
                <div style="display:grid;gap:16px">
                    ${bookPanel('mobile-only')}
                    <section class="lh-card lh-block"><h2>About ${esc(worker.name.split(' ')[0])}</h2>
                        ${worker.bio ? `<p style="color:var(--lh-ink-2);white-space:pre-line">${esc(worker.bio)}</p>` : '<p class="lh-help">No biography added yet.</p>'}
                        ${worker.skills && worker.skills.length ? `<h3 style="font-size:14px;margin:16px 0 8px">Skills &amp; specialisations</h3><div class="lh-tagrow">${worker.skills.map((s) => `<span class="lh-tag">${esc(s)}</span>`).join('')}</div>` : ''}
                        ${worker.languages && worker.languages.length ? `<h3 style="font-size:14px;margin:16px 0 8px">Languages</h3><div class="lh-tagrow">${worker.languages.map((s) => `<span class="lh-tag">${esc(s)}</span>`).join('')}</div>` : ''}</section>
                    <section class="lh-card lh-block" aria-labelledby="h-price"><h2 id="h-price">Pricing</h2>${priceBlock()}</section>
                    <section class="lh-card lh-block" aria-labelledby="h-hours"><h2 id="h-hours">Availability &amp; working hours</h2>
                        <p style="margin-bottom:10px">${LH.availabilityPill(worker)}</p>${hoursHtml}</section>
                    <section class="lh-card lh-block" aria-labelledby="h-port"><h2 id="h-port">Portfolio</h2>${portfolioHtml}</section>
                    <section class="lh-card lh-block" aria-labelledby="h-rev" id="reviews"><h2 id="h-rev">Reviews</h2><div id="reviews-root"><div class="sk sk-line" style="width:40%"></div><div class="sk sk-line"></div></div></section>
                </div>
                ${bookPanel('sticky desktop-only')}
            </div>`;

        // Mobile bottom bar with the primary action
        if (canBook) {
            document.body.classList.add('has-bookbar');
            $('#bookbar-root').innerHTML = `<div class="lh-bookbar"><div>${worker.startingPrice !== null ? `<div class="lh-price">From ${LH.money(worker.startingPrice)}<small>${worker.priceUnit === 'visit' ? ' visit' : '/hr'}</small></div>` : ''}${LH.availabilityPill(worker)}</div><button class="lh-btn lh-btn-primary" type="button" data-book>Book now</button></div>`;
        }

        // Lightbox
        const lb = $('#lightbox');
        root.querySelectorAll('.lh-gallery button').forEach((b) => b.addEventListener('click', () => { $('#lightbox-img').src = worker.portfolio[Number(b.dataset.i)].url; lb.classList.add('open'); }));
        lb.addEventListener('click', () => lb.classList.remove('open'));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('open'); });

        // Favourites (existing client-side "saved workers" feature)
        document.querySelectorAll('#btn-fav').forEach((btn) => {
            const paint = () => { const fresh = LH.user(); const saved = fresh.favorites && fresh.favorites.includes(worker.id); btn.textContent = saved ? '♥ Saved' : '♡ Save professional'; btn.setAttribute('aria-pressed', String(!!saved)); };
            paint();
            btn.addEventListener('click', () => { window.localHireApp.toggleFavorite(u.id, worker.id); paint(); });
        });

        // ── Reviews (real, from the API; hidden reviews are never returned) ──
        (async () => {
            const box = $('#reviews-root');
            const stars = (n) => `${'★'.repeat(n)}${'☆'.repeat(5 - n)}`;
            const card = (r) => `<article class="lh-review"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(r.reviewerName || 'Customer')}</strong><span class="lh-help">${r.createdAt ? esc(new Date(r.createdAt).toLocaleDateString('en-IN', { dateStyle: 'medium' })) : ''}</span></div>
                <div class="lh-stars" role="img" aria-label="${Number(r.rating)} out of 5">${stars(Number(r.rating))}</div><p style="margin-top:4px;color:var(--lh-ink-2);white-space:pre-line">${esc(r.comment || '')}</p><span class="lh-help" style="font-size:11.5px">Verified booking</span></article>`;
            try {
                const first = await LH.data.reviews(worker.id, { limit: 5, page: 1 });
                const sum = first.summary || { count: 0 };
                if (!sum.count) {
                    box.innerHTML = `<div style="text-align:center;padding:18px 0"><strong>No reviews yet</strong><p class="lh-help">Reviews appear here after customers rate completed jobs with ${esc(worker.name.split(' ')[0])}. No rating is shown until then.</p></div>`;
                    return;
                }
                const avg = Number(sum.average);
                const dist = [5, 4, 3, 2, 1].map((n) => [n, Number((sum.distribution || {})[n] || 0)]);
                box.innerHTML = `<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
                    <div><div style="font-size:34px;font-weight:700;line-height:1">${avg.toFixed(1)}</div><div class="lh-stars" aria-hidden="true">${stars(Math.round(avg))}</div><div class="lh-help">${sum.count} ${sum.count === 1 ? 'review' : 'reviews'}</div></div>
                    <div style="flex:1;min-width:180px">${dist.map(([n, c]) => `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px"><span style="width:12px">${n}</span><div style="flex:1;height:6px;background:var(--lh-line);border-radius:3px"><div style="width:${(c / sum.count) * 100}%;height:100%;background:var(--lh-star);border-radius:3px"></div></div><span style="width:22px;color:var(--lh-muted)">${c}</span></div>`).join('')}</div></div>
                    <div id="rev-list">${first.reviews.map(card).join('')}</div><div id="rev-more" style="text-align:center;margin-top:8px"></div>`;
                let page = 1; const pages = first.pages || 1;
                const more = $('#rev-more');
                const paintMore = () => { more.innerHTML = page < pages ? '<button class="lh-btn lh-btn-ghost" type="button" id="rev-more-btn">Show more reviews</button>' : ''; const b = $('#rev-more-btn'); if (b) b.addEventListener('click', async () => { b.disabled = true; b.textContent = 'Loading...'; try { page += 1; const next = await LH.data.reviews(worker.id, { limit: 5, page }); $('#rev-list').insertAdjacentHTML('beforeend', next.reviews.map(card).join('')); paintMore(); } catch (e) { page -= 1; b.disabled = false; b.textContent = 'Could not load. Try again'; } }); };
                paintMore();
            } catch (e) { box.innerHTML = '<p class="lh-help">Reviews could not be loaded right now.</p>'; }
        })();

        // ── Booking request ───────────────────────────────────────────────────
        if (!canBook) return;
        const overlay = $('#book-overlay'); const sheet = $('#book-sheet');
        const bk = { step: 1, description: '', date: '', slot: null, time: '', price: worker.startingPrice || '', addressMode: 'saved', addressId: '', addr: { label: 'Home', flat: '', street: '', landmark: '', city: '', postal: '' }, addresses: [], submitting: false, done: null };
        const loc0 = LH.location.get();
        if (loc0) bk.addr.city = loc0.city || '';

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const pad = (n) => String(n).padStart(2, '0');
        const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
        const fromMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
        const fmt12 = (t) => { const h = Number(t.slice(0, 2)); return `${h % 12 || 12}:${t.slice(3)} ${h < 12 ? 'AM' : 'PM'}`; };

        // Time windows come from the worker's real working hours for the chosen weekday.
        const slotsFor = (dateStr) => {
            if (!dateStr) return { slots: [], closed: false };
            const day = new Date(dateStr + 'T00:00:00').getDay();
            const hrs = (worker.workingHours || []).find((h) => h.dayOfWeek === day);
            if (!(worker.workingHours || []).length) return { slots: null, closed: false };      // no hours published: free time entry
            if (!hrs) return { slots: [], closed: true, day };
            const startMin = toMin(hrs.startTime); const endMin = toMin(hrs.endTime);
            const out = [];
            for (let s = startMin; s + 60 <= endMin; s += 120) {
                const e = Math.min(s + 120, endMin);
                out.push({ start: fromMin(s), end: fromMin(e), label: `${fmt12(fromMin(s))} – ${fmt12(fromMin(e))}` });
            }
            const isToday = dateStr === ymd(new Date());
            const nowMin = new Date().getHours() * 60 + new Date().getMinutes() + 60;
            return { slots: out.map((s) => ({ ...s, past: isToday && toMin(s.start) < nowMin })), closed: false, day };
        };

        const stepBar = () => `<div class="lh-steps" aria-hidden="true">${[1, 2, 3].map((n) => `<span class="${n <= bk.step ? 'on' : ''}"></span>`).join('')}</div>`;
        const err = (id) => `<div class="lh-error" id="${id}" role="alert"></div>`;
        const setErr = (id, msg) => { const el = $('#' + id, sheet); if (el) el.textContent = msg || ''; };

        const render = () => {
            if (bk.done) {
                sheet.innerHTML = `<div style="text-align:center;padding:10px 0 4px">
                    <div class="lh-cat-icon lh-tone-1" style="margin:0 auto 12px;width:64px;height:64px">${LH.icon('bookings')}</div>
                    <h3 id="book-title" class="display" style="font-size:24px">Request sent</h3>
                    <p class="lh-help" style="margin:8px auto 0;max-width:380px">${esc(worker.name)} will review your request and confirm. We'll notify you when they respond. Nothing has been charged.</p>
                    <p style="margin-top:12px"><span class="lh-status REQUESTED">Awaiting ${esc(worker.name.split(' ')[0])}</span></p>
                    <p class="lh-help" style="margin-top:8px">Booking reference <strong>${esc(bk.done.bookingNumber)}</strong></p>
                    <div style="display:grid;gap:8px;margin-top:18px"><a class="lh-btn lh-btn-primary" href="my-jobs.html">View my bookings</a><a class="lh-btn lh-btn-ghost" href="customer-home.html">Back to home</a></div></div>`;
                return;
            }
            const head = `<div class="lh-sheet-head"><h3 id="book-title">${['', 'Tell us what you need', 'Where should they go?', 'Review your request'][bk.step]}</h3><button class="lh-icon-btn" type="button" data-close aria-label="Close">${LH.icon('close')}</button></div>${stepBar()}`;
            if (bk.step === 1) {
                const info = slotsFor(bk.date);
                let timeField;
                if (!bk.date) timeField = '<p class="lh-help">Choose a date to see available times.</p>';
                else if (info.slots === null) timeField = `<input class="lh-input" type="time" id="b-time" value="${esc(bk.time || '10:00')}" aria-describedby="e-time">`;
                else if (info.closed) timeField = `<div class="lh-alert warn">${esc(worker.name.split(' ')[0])} doesn't usually work on ${LH.dayName[info.day]}s. Please choose another date.</div>`;
                else if (!info.slots.some((s) => !s.past)) timeField = '<div class="lh-alert warn">No time windows are left today. Please choose another date.</div>';
                else timeField = `<div class="lh-slots" role="group" aria-label="Time windows">${info.slots.map((s, i) => `<button type="button" class="lh-slot" data-slot="${i}" aria-pressed="${bk.slot && bk.slot.start === s.start}" ${s.past ? 'disabled' : ''}>${esc(s.label)}</button>`).join('')}</div>`;
                const min = new Date(); const max = new Date(Date.now() + 90 * 86400000);
                sheet.innerHTML = `${head}
                    <div class="lh-field" style="margin-top:0"><label for="b-desc">Describe the problem or job</label>
                        <textarea class="lh-textarea" id="b-desc" maxlength="1000" placeholder="e.g. The kitchen tap has been leaking under the sink since yesterday." aria-describedby="e-desc">${esc(bk.description)}</textarea>
                        <div class="lh-help"><span id="desc-n">${bk.description.length}</span>/1000 · at least 10 characters</div>${err('e-desc')}</div>
                    <div class="lh-field"><label for="b-date">Preferred date</label><input class="lh-input" type="date" id="b-date" min="${ymd(min)}" max="${ymd(max)}" value="${esc(bk.date)}" aria-describedby="e-date">${err('e-date')}</div>
                    <div class="lh-field"><span class="lh-label">Preferred time</span>${timeField}${err('e-time')}</div>
                    <div class="lh-field"><label for="b-price">Your proposed price (₹)</label><input class="lh-input" type="number" id="b-price" min="50" step="10" value="${esc(bk.price)}" inputmode="numeric" aria-describedby="e-price">
                        <div class="lh-help">${worker.startingPrice !== null ? `Prefilled from ${esc(worker.name.split(' ')[0])}'s listed ${worker.priceUnit === 'visit' ? 'visit charge' : 'hourly rate'}. ` : ''}The final amount is agreed with the professional.</div>${err('e-price')}</div>
                    <button class="lh-btn lh-btn-primary lh-btn-block" type="button" id="b-next" style="margin-top:18px">Continue</button>`;
                const d = $('#b-desc', sheet); d.addEventListener('input', () => { bk.description = d.value; $('#desc-n', sheet).textContent = d.value.length; });
                $('#b-date', sheet).addEventListener('change', (e) => { bk.date = e.target.value; bk.slot = null; render(); $('#b-date', sheet).focus(); });
                const t = $('#b-time', sheet); if (t) t.addEventListener('input', () => { bk.time = t.value; });
                $('#b-price', sheet).addEventListener('input', (e) => { bk.price = e.target.value; });
                sheet.querySelectorAll('[data-slot]').forEach((b) => b.addEventListener('click', () => { bk.slot = slotsFor(bk.date).slots[Number(b.dataset.slot)]; render(); const again = sheet.querySelector(`[data-slot="${b.dataset.slot}"]`); if (again) again.focus(); }));
                $('#b-next', sheet).addEventListener('click', () => {
                    let ok = true;
                    ['e-desc', 'e-date', 'e-time', 'e-price'].forEach((id) => setErr(id, ''));
                    if (bk.description.trim().length < 10) { setErr('e-desc', 'Please describe the job in at least 10 characters.'); ok = false; }
                    if (!bk.date) { setErr('e-date', 'Choose a date.'); ok = false; }
                    const info2 = slotsFor(bk.date);
                    if (bk.date && info2.slots === null) { if (!bk.time) { setErr('e-time', 'Choose a time.'); ok = false; } }
                    else if (bk.date && (info2.closed || !bk.slot)) { setErr('e-time', info2.closed ? 'Pick a day the professional works.' : 'Choose a time window.'); ok = false; }
                    if (!(Number(bk.price) >= 50)) { setErr('e-price', 'Enter a price of at least ₹50.'); ok = false; }
                    if (ok) { bk.step = 2; render(); loadAddresses(); }
                });
            } else if (bk.step === 2) {
                const cards = bk.addresses.map((a) => `<label class="lh-radio-card"><input type="radio" name="addr" value="${esc(a.id)}" ${bk.addressMode === 'saved' && bk.addressId === a.id ? 'checked' : ''}><span><strong>${esc(a.label)}</strong><br>${esc([a.flatNumber, a.street, a.landmark, a.city, a.postalCode].filter(Boolean).join(', '))}</span></label>`).join('');
                const a = bk.addr;
                sheet.innerHTML = `${head}
                    <div id="addr-list">${bk.addresses.length ? cards : ''}</div>
                    <label class="lh-radio-card"><input type="radio" name="addr" value="__new" ${bk.addressMode === 'new' ? 'checked' : ''}><span><strong>${bk.addresses.length ? 'Use a different address' : 'Enter the service address'}</strong></span></label>
                    <div id="new-addr" ${bk.addressMode === 'new' ? '' : 'hidden'}>
                        <div class="lh-field"><label for="a-flat">House / flat no.</label><input class="lh-input" id="a-flat" value="${esc(a.flat)}" autocomplete="address-line2"></div>
                        <div class="lh-field"><label for="a-street">Street / area</label><input class="lh-input" id="a-street" value="${esc(a.street)}" autocomplete="address-line1" aria-describedby="e-street">${err('e-street')}</div>
                        <div class="lh-field"><label for="a-landmark">Landmark (optional)</label><input class="lh-input" id="a-landmark" value="${esc(a.landmark)}"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                            <div class="lh-field"><label for="a-city">City</label><input class="lh-input" id="a-city" value="${esc(a.city)}" autocomplete="address-level2" aria-describedby="e-city">${err('e-city')}</div>
                            <div class="lh-field"><label for="a-postal">PIN code</label><input class="lh-input" id="a-postal" value="${esc(a.postal)}" inputmode="numeric" autocomplete="postal-code" aria-describedby="e-postal">${err('e-postal')}</div></div>
                        <div class="lh-field"><label for="a-label">Save as</label><select class="lh-select" id="a-label"><option>Home</option><option>Office</option><option>Other</option></select></div></div>
                    ${err('e-addr')}
                    <div style="display:flex;gap:10px;margin-top:18px"><button class="lh-btn lh-btn-ghost" type="button" id="b-back">Back</button><button class="lh-btn lh-btn-primary" style="flex:1" type="button" id="b-next">Review request</button></div>`;
                const sync = () => { const v = (sheet.querySelector('input[name="addr"]:checked') || {}).value; bk.addressMode = v === '__new' ? 'new' : 'saved'; if (v && v !== '__new') bk.addressId = v; $('#new-addr', sheet).hidden = bk.addressMode !== 'new'; };
                sheet.querySelectorAll('input[name="addr"]').forEach((r) => r.addEventListener('change', sync));
                ['flat', 'street', 'landmark', 'city', 'postal'].forEach((k) => { const el = $('#a-' + k, sheet); if (el) el.addEventListener('input', () => { bk.addr[k] = el.value; }); });
                $('#a-label', sheet).value = a.label; $('#a-label', sheet).addEventListener('change', (e) => { bk.addr.label = e.target.value; });
                $('#b-back', sheet).addEventListener('click', () => { bk.step = 1; render(); });
                $('#b-next', sheet).addEventListener('click', () => {
                    ['e-street', 'e-city', 'e-postal', 'e-addr'].forEach((id) => setErr(id, ''));
                    if (bk.addressMode === 'saved' && !bk.addressId) { setErr('e-addr', 'Choose an address or enter a new one.'); return; }
                    if (bk.addressMode === 'new') {
                        let ok = true;
                        if (bk.addr.street.trim().length < 3) { setErr('e-street', 'Enter the street or area.'); ok = false; }
                        if (bk.addr.city.trim().length < 2) { setErr('e-city', 'Enter the city.'); ok = false; }
                        if (!/^[0-9A-Za-z -]{4,10}$/.test(bk.addr.postal.trim())) { setErr('e-postal', 'Enter a valid PIN code.'); ok = false; }
                        if (!ok) return;
                    }
                    bk.step = 3; render();
                });
            } else {
                const addr = bk.addressMode === 'new' ? [bk.addr.flat, bk.addr.street, bk.addr.landmark, bk.addr.city, bk.addr.postal].filter(Boolean).join(', ')
                    : (() => { const a = bk.addresses.find((x) => x.id === bk.addressId) || {}; return [a.flatNumber, a.street, a.landmark, a.city, a.postalCode].filter(Boolean).join(', '); })();
                const when = bk.slot ? bk.slot.label : fmt12(bk.time || '10:00');
                sheet.innerHTML = `${head}
                    <dl class="lh-summary">
                        <dt>Professional</dt><dd><strong>${esc(worker.name)}</strong> · ${esc(worker.category)}</dd>
                        <dt>Job</dt><dd>${esc(bk.description.trim())}</dd>
                        <dt>Date</dt><dd>${esc(new Date(bk.date + 'T00:00:00').toLocaleDateString('en-IN', { dateStyle: 'full' }))}</dd>
                        <dt>Time</dt><dd>${esc(when)}</dd>
                        <dt>Location</dt><dd>${esc(addr)}</dd>
                        <dt>Proposed price</dt><dd><strong>${LH.money(bk.price)}</strong></dd></dl>
                    <div class="lh-alert" style="margin-top:14px;font-size:13px">This is a <strong>request</strong>. ${esc(worker.name.split(' ')[0])} has to confirm it, and <strong>no payment is taken now</strong>. You can track it in My bookings.</div>
                    <div id="submit-err" class="lh-alert err" role="alert" style="display:none;margin-top:12px"></div>
                    <div style="display:flex;gap:10px;margin-top:18px"><button class="lh-btn lh-btn-ghost" type="button" id="b-back">Back</button><button class="lh-btn lh-btn-primary" style="flex:1" type="button" id="b-submit">Send booking request</button></div>`;
                $('#b-back', sheet).addEventListener('click', () => { bk.step = 2; render(); });
                $('#b-submit', sheet).addEventListener('click', submit);
            }
            const first = sheet.querySelector('textarea, input:not([type=radio]), button.lh-btn-primary'); if (first && bk.step === 1 && !bk.description) first.focus();
        };

        const loadAddresses = async () => {
            if (bk.addresses.length || bk.addressesLoaded) return;
            bk.addressesLoaded = true;
            try {
                bk.addresses = (await LH.data.addresses()).addresses || [];
                const def = bk.addresses.find((a) => a.isDefault) || bk.addresses[0];
                bk.addressMode = def ? 'saved' : 'new'; bk.addressId = def ? def.id : '';
            } catch (e) { bk.addressMode = 'new'; }
            if (bk.step === 2) render();
        };

        const submit = async () => {
            if (bk.submitting) return;
            bk.submitting = true;
            const btn = $('#b-submit', sheet); btn.disabled = true; btn.textContent = 'Sending…';
            const box = $('#submit-err', sheet); box.style.display = 'none';
            try {
                let addressId = bk.addressId;
                if (bk.addressMode === 'new') {
                    const l = LH.location.get();
                    const created = await LH.data.createAddress({ label: bk.addr.label, flatNumber: bk.addr.flat, street: bk.addr.street.trim(), landmark: bk.addr.landmark, city: bk.addr.city.trim(), postalCode: bk.addr.postal.trim(), ...(l && l.city && l.city.toLowerCase() === bk.addr.city.trim().toLowerCase() ? { latitude: l.lat, longitude: l.lng } : {}), isDefault: bk.addresses.length === 0 });
                    addressId = (created.address || created).id;
                }
                const start = bk.slot ? bk.slot.start : (bk.time || '10:00');
                const res = await LH.data.createBooking({
                    workerId: worker.id, scheduledAt: new Date(`${bk.date}T${start}:00`).toISOString(), timeSlot: bk.slot ? bk.slot.label : fmt12(start),
                    agreedPrice: Number(bk.price), problemDescription: bk.description.trim(), addressId
                });
                bk.done = res.booking;
                render();
            } catch (e) {
                const msg = e.data && e.data.code === 'WORKER_NOT_VERIFIED' ? 'This professional is no longer available for new bookings.' : (e.message || 'We could not send your request.');
                box.textContent = msg; box.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Send booking request';
            } finally { bk.submitting = false; }
        };

        const open = () => { bk.step = 1; bk.done = null; render(); overlay.classList.add('open'); };
        const close = () => overlay.classList.remove('open');
        document.querySelectorAll('[data-book]').forEach((b) => b.addEventListener('click', open));
        overlay.addEventListener('click', (e) => { if (e.target === overlay || e.target.closest('[data-close]')) close(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
        if (params.get('book') === '1') open();
    })();
    </script>
</body>
</html>

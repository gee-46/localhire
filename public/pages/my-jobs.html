<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/payments.css">
    <link rel="stylesheet" href="../css/comm.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container" style="padding: 3rem 1.5rem;">
        
        <div id="push-banner"></div>

        <div class="flex items-center justify-between" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1.5rem;">
            <div>
                <h2>My Dashboard</h2>
                <p class="text-muted">Manage jobs and saved workers.</p>
            </div>
            <a href="post-job.html" class="btn btn-primary" id="btn-post" style="display: none;">Post New Job</a>
        </div>

        <!-- Dashboard Tabs -->
        <div class="flex gap-4" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light);" id="tab-container">
            <button id="tab-myjobs" class="btn" style="background: transparent; border-radius: 0; padding: 0.75rem 0; border-bottom: 2px solid var(--primary); color: var(--text-main);">My Jobs</button>
            <button id="tab-saved" class="btn text-muted" style="background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Saved Workers</button>
            <button id="tab-apps" class="btn text-muted" style="display: none; background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Applications</button>
            <button id="tab-profile-photo" class="btn text-muted" style="background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Profile Photo</button>
        </div>

        <!-- Views -->
        <div id="view-myjobs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Jobs populated via JS -->
        </div>

        <div id="view-saved" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" style="display: none;">
            <!-- Saved workers populated via JS -->
        </div>

        <div id="view-apps" style="display: none; padding: 1rem 0;">
            <!-- Applications populated via JS -->
            <div id="apps-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            
            <div id="no-apps" style="display: none; text-align: center; padding: 4rem 2rem;" class="glass-card">
                <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <h3>No applications yet</h3>
                <p class="text-muted">Jobs you apply to will show up here.</p>
                <a href="jobs.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Jobs</a>
            </div>
        </div>

        <!-- Profile Photo Management View (Both Customer & Worker) -->
        <div id="view-profile-photo" style="display: none; padding: 1rem 0;">
            <div class="glass-card flex flex-col gap-6" style="max-width: 600px; margin: 0 auto; padding: 2.5rem;">
                <div class="flex items-center gap-6 flex-wrap">
                    <div style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary); background: var(--bg-dark); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
                        <img id="dash-avatar-preview" src="" alt="Profile Photo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <div id="dash-avatar-placeholder" style="font-size: 2.5rem; font-weight: bold; color: var(--primary);">?</div>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 0.25rem;">Your Profile Photo</h3>
                        <p class="text-muted" style="font-size: 0.85rem;">Upload a personal profile picture (JPG, PNG, or WebP, max 5 MB).</p>
                    </div>
                </div>

                <div class="flex gap-3 items-center flex-wrap" style="padding-top: 1rem; border-top: 1px solid var(--border-light);">
                    <label for="dash-avatar-input" class="btn btn-outline" style="cursor: pointer; padding: 0.6rem 1.25rem; font-size: 0.9rem;">
                        <svg class="icon" viewBox="0 0 24 24" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Choose Photo
                    </label>
                    <input type="file" id="dash-avatar-input" accept="image/jpeg,image/png,image/webp,image/jpg" style="display: none;">

                    <button type="button" id="dash-btn-upload" class="btn btn-primary" style="display: none; padding: 0.6rem 1.25rem; font-size: 0.9rem;">
                        Upload to Supabase
                    </button>
                    <button type="button" id="dash-btn-cancel" class="btn btn-outline" style="display: none; padding: 0.6rem 1rem; font-size: 0.9rem;">
                        Cancel
                    </button>
                    <button type="button" id="dash-btn-remove" class="btn btn-outline" style="display: none; padding: 0.6rem 1rem; font-size: 0.9rem; color: #ef4444; border-color: rgba(239,68,68,0.4);">
                        Remove Photo
                    </button>
                </div>

                <p id="dash-avatar-msg" style="display: none; font-size: 0.85rem; margin-top: 0.5rem;"></p>
            </div>
        </div>

        <!-- Customer Applications Modal -->
        <div id="customer-apps-modal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
            <div class="glass-card animate-fade-in flex flex-col" style="width: 100%; max-width: 600px; max-height: 80vh; padding: 2.5rem;">
                <div class="flex justify-between items-start" style="margin-bottom: 1.5rem; flex-shrink: 0;">
                    <h3 style="margin: 0; font-size: 1.5rem;">Quotes Received</h3>
                    <button type="button" class="btn" id="close-customer-apps" style="padding: 0; background: transparent; color: var(--text-muted);">&times;</button>
                </div>
                
                <p id="modal-job-title" style="font-weight: 500; margin-bottom: 1.5rem; flex-shrink: 0;"></p>

                <div id="modal-apps-list" style="overflow-y: auto; flex-grow: 1; padding-right: 0.5rem;" class="flex flex-col gap-4">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
        
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/payments.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavbar('navbar-container', 'pages');

            const user = window.localHireApp.getCurrentUser();
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            // Helper to render booking cards
            function createBookingCard(booking, role) {
                const isWorker = role === 'Worker';
                const otherPerson = isWorker ? booking.customer : booking.worker;
                const otherUserId = otherPerson ? (otherPerson.id || otherPerson._id || (isWorker ? booking.customerId : booking.workerId)) : (isWorker ? booking.customerId : booking.workerId);
                const rawName = otherPerson ? otherPerson.name : (isWorker ? 'Customer' : 'Professional');
                const otherName = escapeHTML(rawName);
                const otherAvatar = otherPerson && otherPerson.avatarUrl ? escapeHTML(otherPerson.avatarUrl) : `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(rawName)}`;
                const scheduledDate = escapeHTML(new Date(booking.scheduledAt).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }));
                const isTrackingStatus = ['CONFIRMED', 'DISPATCHED', 'IN_PROGRESS'].includes(booking.status);
                const safeBookingNumber = escapeHTML(booking.bookingNumber || 'BK-DIRECT');
                const safeTimeSlot = escapeHTML(booking.timeSlot || 'Flexible');
                const safeAgreedPrice = Number(booking.agreedPrice || 0);
                const safeSubtitle = isWorker
                    ? (booking.customer && booking.customer.email ? escapeHTML(booking.customer.email) : 'Verified Customer')
                    : (booking.worker && booking.worker.category ? escapeHTML(booking.worker.category) : 'Service Professional');
                
                let badgeClass = 'badge';
                let statusLabel = booking.status;
                if (booking.status === 'REQUESTED') {
                    badgeClass = 'badge';
                    statusLabel = 'Requested';
                } else if (booking.status === 'CONFIRMED') {
                    badgeClass = 'badge-primary';
                    statusLabel = 'Confirmed';
                } else if (booking.status === 'DISPATCHED') {
                    badgeClass = 'badge-primary';
                    statusLabel = 'On The Way';
                } else if (booking.status === 'IN_PROGRESS') {
                    badgeClass = 'badge-primary';
                    statusLabel = 'In Progress';
                } else if (booking.status === 'AWAITING_CUSTOMER_CONFIRMATION') {
                    badgeClass = 'badge';
                    statusLabel = isWorker ? 'Awaiting customer' : 'Confirm job';
                } else if (booking.status === 'COMPLETED') {
                    badgeClass = 'badge';
                    statusLabel = 'Completed';
                } else if (booking.status === 'CANCELLED') {
                    badgeClass = 'badge';
                    statusLabel = 'Cancelled';
                } else if (booking.status === 'DISPUTED') {
                    badgeClass = 'badge';
                    statusLabel = 'Under dispute';
                }

                const PAY = window.LocalHirePayments;
                const payment = booking.payment || null;
                const bid = escapeHTML(booking.id);
                const row = (inner) => `<div class="pay-status">${inner}</div>`;
                const btn = (cls, attrs, label) => `<button type="button" class="pay-btn ${cls} sm" ${attrs}>${label}</button>`;
                const act = (status, cls, label) => btn(cls, `data-act="status" data-booking-id="${bid}" data-status="${status}"`, label);
                const money = PAY.bookingMoneyHtml({ role, booking, payment });
                let actionButtons = '';

                if (isWorker) {
                    const st = booking.status;
                    if (st === 'REQUESTED') {
                        actionButtons = row(`<div class="pay-hint">Accepting confirms the price the customer will pay.</div>
                            <div class="flex gap-2">${btn('primary', `data-act="accept" data-booking-id="${bid}" data-price="${safeAgreedPrice}"`, 'Accept &amp; confirm price')}${act('CANCELLED', 'danger', 'Decline')}</div>`);
                    } else if (st === 'CONFIRMED') {
                        actionButtons = row(`${money}<div class="flex gap-2">${act('DISPATCHED', 'primary', '🚗 Start journey')}${act('IN_PROGRESS', 'ghost', '▶ Start service')}</div>
                            <div class="flex gap-2">${btn('ghost', `data-act="reschedule" data-booking-id="${bid}"`, 'Reschedule')}${act('CANCELLED', 'danger', 'Cancel booking')}</div>${payment && payment.paid ? '<div class="pay-hint">If you cancel, the customer is refunded in full.</div>' : ''}`);
                    } else if (st === 'DISPATCHED') {
                        actionButtons = row(`${money}${act('IN_PROGRESS', 'ghost', '▶ Start service')}<div>${act('CANCELLED', 'danger', 'Cancel booking')}</div>`);
                    } else if (st === 'IN_PROGRESS') {
                        actionButtons = row(`${money}${act('AWAITING_CUSTOMER_CONFIRMATION', 'primary', '🏁 Finish &amp; request customer confirmation')}
                            <div class="pay-hint">The customer confirms the job is complete; that is what releases your earnings.</div>
                            ${payment && payment.paid ? btn('ghost', `data-act="dispute" data-booking-id="${bid}"`, 'Report a problem') : ''}`);
                    } else if (st === 'AWAITING_CUSTOMER_CONFIRMATION') {
                        actionButtons = row(`${money}<span class="pay-badge info">Waiting for the customer to confirm completion</span>${payment && payment.paid ? btn('ghost', `data-act="dispute" data-booking-id="${bid}"`, 'Report a problem') : ''}`);
                    } else if (st === 'DISPUTED') {
                        actionButtons = row(`${money}<span class="pay-badge warn">Dispute under review by LocalHire</span>`);
                    } else if (st === 'COMPLETED' || st === 'CANCELLED') {
                        actionButtons = money ? row(money) : '';
                    }
                } else {
                    const wName = escapeHTML(booking.worker ? (booking.worker.name || 'Professional') : 'Professional');
                    const st = booking.status;
                    const paid = Boolean(payment && payment.paid);
                    const payable = ['CONFIRMED', 'DISPATCHED', 'IN_PROGRESS', 'AWAITING_CUSTOMER_CONFIRMATION'].includes(st) && !paid && !(payment && payment.state === 'REFUNDED');
                    const cancelNote = paid ? (st === 'DISPATCHED' || st === 'IN_PROGRESS' ? 'Cancelling now refunds your payment, less any cancellation fee that applies once the professional is on the way.' : 'Cancelling refunds your payment in full.') : '';
                    if (st === 'REQUESTED') {
                        actionButtons = row(`<span class="pay-badge warn">Waiting for the professional to accept and confirm the price</span>
                            <div class="pay-hint">You will be asked to pay once they accept.</div>${act('CANCELLED', 'danger', 'Cancel request')}`);
                    } else if (payable) {
                        actionButtons = row(`${money}
                            <div class="pay-line"><span>Service price <b>₹${safeAgreedPrice}</b></span><span class="pay-hint">fees &amp; taxes shown at checkout</span></div>
                            ${btn('primary', `data-act="pay" data-booking-id="${bid}"`, payment && payment.state === 'FAILED' ? 'Try payment again' : 'Pay now')}
                            ${st === 'AWAITING_CUSTOMER_CONFIRMATION' ? '<div class="pay-hint">The professional says the job is finished. Pay first, then confirm completion.</div>' : ''}
                            ${st !== 'AWAITING_CUSTOMER_CONFIRMATION' ? act('CANCELLED', 'danger', 'Cancel booking') : ''}`);
                    } else if (paid && (st === 'IN_PROGRESS' || st === 'AWAITING_CUSTOMER_CONFIRMATION')) {
                        actionButtons = row(`${money}
                            ${payment.refundPending ? '<div class="pay-hint">A refund is in progress. You can confirm once it finishes.</div>' : ''}
                            ${btn('good', `data-act="complete" data-booking-id="${bid}" data-worker="${wName}" data-amount="${payment.totalAmount}"${payment.refundPending ? ' disabled' : ''}`, '✓ Confirm completion')}
                            ${btn('ghost', `data-act="dispute" data-booking-id="${bid}"`, 'Report a problem')}
                            <div class="pay-hint">Your payment goes to the professional only after you confirm.</div>`);
                    } else if (paid && (st === 'CONFIRMED' || st === 'DISPATCHED')) {
                        actionButtons = row(`${money}${act('CANCELLED', 'danger', 'Cancel booking')}<div class="pay-hint">${cancelNote}</div>`);
                    } else if (st === 'DISPUTED') {
                        actionButtons = row(`${money}<span class="pay-badge warn">Dispute under review by LocalHire. Payment is on hold.</span>`);
                    } else if (st === 'COMPLETED') {
                        actionButtons = row(`${money || '<span class="pay-badge ok">Completed</span>'}<a class="pay-btn ghost sm" href="payments.html">View transaction</a>`);
                    } else if (money) {
                        actionButtons = row(`${money}<a class="pay-btn ghost sm" href="payments.html">View transaction</a>`);
                    }
                }

                const wNameForReview = escapeHTML(booking.worker ? (booking.worker.name || 'your professional') : 'your professional');
                // Review prompt / status (customers only; the server decides eligibility and sends reviewState).
                if (!isWorker && booking.reviewState) {
                    const rs = booking.reviewState;
                    const stars = (n) => '\u2605'.repeat(n) + '\u2606'.repeat(5 - n);
                    if (rs.review) {
                        actionButtons += `<div class="pay-status" data-review-box="${bid}"><div class="pay-line"><span>Your review</span><span class="pay-badge ${rs.review.status === 'HIDDEN' ? 'warn' : 'ok'}">${rs.review.status === 'HIDDEN' ? 'Removed by moderators' : 'Submitted'}</span></div>
                            ${rs.review.status === 'HIDDEN' ? '' : `<div role="img" aria-label="${Number(rs.review.rating)} out of 5" style="color:#f5a524;letter-spacing:1px">${stars(Number(rs.review.rating))}</div><div class="pay-hint" style="white-space:pre-line">${escapeHTML(rs.review.comment)}</div>`}</div>`;
                    } else if (rs.canReview) {
                        actionButtons += `<div class="pay-status" data-review-box="${bid}"><div class="pay-hint"><b>How was ${wNameForReview}?</b> A short review helps other customers choose. You can review once.</div>
                            ${btn('primary', `data-act="review" data-booking-id="${bid}" data-worker="${wNameForReview}"`, '\u2605 Rate your experience')}</div>`;
                    } else if (rs.code === 'DISPUTED') {
                        actionButtons += `<div class="pay-status" data-review-box="${bid}"><div class="pay-hint">${escapeHTML(rs.reason)}</div></div>`;
                    }
                }

                // Journey status is derived on the server (booking status is unchanged). Live tracking happens on the track page.
                const JOURNEY = { BOOKING_ACCEPTED: 'Accepted', JOURNEY_STARTED: 'On the way', WORKER_ARRIVED: 'Arrived', SERVICE_IN_PROGRESS: 'Service in progress', COMPLETION_REQUESTED: 'Completion requested', COMPLETED: 'Completed' };
                const trackHref = `track.html?booking=${encodeURIComponent(booking.id)}`;
                const journeyBlock = (isTrackingStatus || booking.status === 'AWAITING_CUSTOMER_CONFIRMATION') && booking.journeyStatus ? `
                    <div class="pay-status" data-journey="${escapeHTML(booking.id)}">
                        <div class="pay-line"><span>📍 Journey</span><span class="pay-badge ${booking.journeyStatus === 'JOURNEY_STARTED' ? 'info' : ''}">${escapeHTML(JOURNEY[booking.journeyStatus] || '')}</span></div>
                        <a class="pay-btn ${booking.status === 'DISPATCHED' ? 'primary' : 'ghost'} sm" href="${trackHref}">${isWorker ? (booking.status === 'DISPATCHED' ? 'Open journey: navigate, share location, arrived' : 'Open journey') : (booking.status === 'DISPATCHED' ? 'Track live location' : 'View journey status')}</a>
                    </div>` : '';

                return `
                    <div class="glass-card flex-col gap-4 animate-fade-in" id="booking-${escapeHTML(booking.id)}" style="border: 1px solid var(--border-light);">
                        <div class="flex justify-between items-start">
                            <div>
                                <span style="font-family: monospace; font-size: 0.8rem; color: var(--primary); font-weight: 700;">${safeBookingNumber}</span>
                                <h4 style="margin: 0.25rem 0 0 0; font-size: 1.1rem; color: var(--text-main);">${isWorker ? 'Booking from ' + otherName : 'Hired ' + otherName}</h4>
                            </div>
                            <span class="${badgeClass}" style="white-space: nowrap;">${statusLabel}</span>
                        </div>

                        <div class="flex items-center gap-3" style="padding: 0.5rem 0;">
                            <img src="${otherAvatar}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover;">
                            <div style="font-size: 0.85rem; line-height: 1.4; flex: 1;">
                                <strong style="color: var(--text-main); display: block;">${otherName}</strong>
                                <span class="text-muted">${safeSubtitle}</span>
                            </div>
                            <a class="btn btn-outline" href="chat.html?booking=${encodeURIComponent(booking.id)}" style="padding: 0.35rem 0.75rem; font-size: 0.75rem; position: relative; text-decoration: none;" aria-label="Chat about booking ${safeBookingNumber}">💬 Chat<span class="cm-badge" data-chat-n="${escapeHTML(booking.id)}" hidden style="position:absolute;top:-8px;right:-8px"></span></a>
                        </div>

                        ${booking.problemDescription ? `<div style="font-size: 0.85rem; padding: 0.5rem 0 0.75rem;"><strong>Job description:</strong> <span class="text-muted">${escapeHTML(booking.problemDescription)}</span></div>` : ''}
                        <div class="flex flex-col gap-2" style="font-size: 0.85rem; background: rgba(0,0,0,0.03); padding: 0.75rem; border-radius: 8px;">
                            <div class="flex items-center gap-2 text-muted">
                                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span><strong>Date:</strong> ${scheduledDate} (${safeTimeSlot})</span>
                            </div>
                            <div class="flex items-center gap-2 text-muted">
                                <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                                <span><strong>Agreed Rate:</strong> <strong style="color: var(--text-main);">₹${safeAgreedPrice}</strong></span>
                            </div>
                        </div>

                        ${journeyBlock}
                        ${actionButtons}
                    </div>
                `;
            }

            // UI Elements
            const btnPost = document.getElementById('btn-post');
            const tabMyJobs = document.getElementById('tab-myjobs');
            const tabSaved = document.getElementById('tab-saved');
            const tabApps = document.getElementById('tab-apps');
            const tabProfilePhoto = document.getElementById('tab-profile-photo');
            const viewMyJobs = document.getElementById('view-myjobs');
            const viewSaved = document.getElementById('view-saved');
            const viewApps = document.getElementById('view-apps');
            const viewProfilePhoto = document.getElementById('view-profile-photo');

            // Role specific logic
            if (user.role === 'Customer') {
                btnPost.style.display = 'inline-flex';
                tabSaved.style.display = 'inline-block';
                tabApps.style.display = 'none';
            } else if (user.role === 'Worker') {
                btnPost.style.display = 'none';
                tabSaved.style.display = 'none';
                tabMyJobs.textContent = 'Active Contracts';
                tabApps.style.display = 'inline-block';
            }

            // Tab Switching Logic
            function setActiveTab(tabBtn, viewDiv) {
                [tabMyJobs, tabSaved, tabApps, tabProfilePhoto].forEach(t => {
                    if (t) {
                        t.style.borderBottom = 'none';
                        t.style.color = 'var(--text-muted)';
                    }
                });
                tabBtn.style.borderBottom = '2px solid var(--primary)';
                tabBtn.style.color = 'var(--text-main)';

                [viewMyJobs, viewSaved, viewApps, viewProfilePhoto].forEach(v => {
                    if (v) v.style.display = 'none';
                });
                
                if (viewDiv.id === 'view-apps' || viewDiv.id === 'view-profile-photo' || viewDiv.innerHTML.includes('No jobs') || viewDiv.innerHTML.includes('No saved') || viewDiv.innerHTML.includes('No active contracts')) {
                    viewDiv.style.display = 'block';
                } else {
                    viewDiv.style.display = 'grid';
                }
            }

            tabMyJobs.addEventListener('click', () => setActiveTab(tabMyJobs, viewMyJobs));
            if (tabSaved) tabSaved.addEventListener('click', () => setActiveTab(tabSaved, viewSaved));
            if (tabApps) tabApps.addEventListener('click', () => setActiveTab(tabApps, viewApps));
            if (tabProfilePhoto) tabProfilePhoto.addEventListener('click', () => setActiveTab(tabProfilePhoto, viewProfilePhoto));

            // Dashboard Profile Photo Logic
            const dashAvatarPreview = document.getElementById('dash-avatar-preview');
            const dashAvatarPlaceholder = document.getElementById('dash-avatar-placeholder');
            const dashAvatarInput = document.getElementById('dash-avatar-input');
            const dashBtnUpload = document.getElementById('dash-btn-upload');
            const dashBtnCancel = document.getElementById('dash-btn-cancel');
            const dashBtnRemove = document.getElementById('dash-btn-remove');
            const dashAvatarMsg = document.getElementById('dash-avatar-msg');

            const refreshDashAvatar = () => {
                const fresh = window.localHireApp.getCurrentUser() || user;
                if (fresh && fresh.avatarUrl) {
                    dashAvatarPreview.src = fresh.avatarUrl;
                    dashAvatarPreview.style.display = 'block';
                    dashAvatarPlaceholder.style.display = 'none';
                    dashBtnRemove.style.display = 'inline-block';
                } else {
                    dashAvatarPreview.src = '';
                    dashAvatarPreview.style.display = 'none';
                    dashAvatarPlaceholder.textContent = (fresh?.name || '?').charAt(0).toUpperCase();
                    dashAvatarPlaceholder.style.display = 'flex';
                    dashBtnRemove.style.display = 'none';
                }
            };
            refreshDashAvatar();

            let pendingDashFile = null;

            if (dashAvatarInput) {
                dashAvatarInput.addEventListener('change', (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;

                    const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
                    if (!validTypes.includes(file.type.toLowerCase())) {
                        dashAvatarMsg.textContent = 'Invalid file type. Please select a JPG, PNG, or WebP image.';
                        dashAvatarMsg.style.color = '#ef4444';
                        dashAvatarMsg.style.display = 'block';
                        dashAvatarInput.value = '';
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        dashAvatarMsg.textContent = 'Image exceeds 5 MB. Please choose a smaller photo.';
                        dashAvatarMsg.style.color = '#ef4444';
                        dashAvatarMsg.style.display = 'block';
                        dashAvatarInput.value = '';
                        return;
                    }

                    pendingDashFile = file;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        dashAvatarPreview.src = evt.target.result;
                        dashAvatarPreview.style.display = 'block';
                        dashAvatarPlaceholder.style.display = 'none';
                        dashBtnUpload.style.display = 'inline-block';
                        dashBtnCancel.style.display = 'inline-block';
                        dashBtnRemove.style.display = 'none';
                        dashAvatarMsg.textContent = `Ready to upload: ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
                        dashAvatarMsg.style.color = '#94a3b8';
                        dashAvatarMsg.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                });

                dashBtnCancel.addEventListener('click', () => {
                    pendingDashFile = null;
                    dashAvatarInput.value = '';
                    dashBtnUpload.style.display = 'none';
                    dashBtnCancel.style.display = 'none';
                    dashAvatarMsg.style.display = 'none';
                    refreshDashAvatar();
                });

                dashBtnUpload.addEventListener('click', async () => {
                    if (!pendingDashFile) return;

                    dashBtnUpload.disabled = true;
                    dashBtnUpload.textContent = 'Uploading...';
                    dashAvatarMsg.textContent = 'Uploading to Supabase Storage...';
                    dashAvatarMsg.style.color = '#38bdf8';
                    dashAvatarMsg.style.display = 'block';

                    try {
                        const res = await window.localHireAPI.uploadAvatar(pendingDashFile);
                        if (res && res.success) {
                            dashAvatarMsg.textContent = 'Profile picture updated successfully!';
                            dashAvatarMsg.style.color = '#10b981';
                            dashBtnUpload.style.display = 'none';
                            dashBtnCancel.style.display = 'none';
                            pendingDashFile = null;
                            dashAvatarInput.value = '';
                            renderNavbar('navbar-container', 'pages');
                            refreshDashAvatar();
                        } else {
                            throw new Error(res?.message || 'Upload failed.');
                        }
                    } catch (err) {
                        console.error('[Avatar Upload]', err);
                        dashAvatarMsg.textContent = err.message || 'Failed to upload photo.';
                        dashAvatarMsg.style.color = '#ef4444';
                    } finally {
                        dashBtnUpload.disabled = false;
                        dashBtnUpload.textContent = 'Upload to Supabase';
                    }
                });

                dashBtnRemove.addEventListener('click', async () => {
                    if (!confirm('Are you sure you want to remove your profile photo?')) return;

                    dashBtnRemove.disabled = true;
                    dashAvatarMsg.textContent = 'Removing photo...';
                    dashAvatarMsg.style.color = '#94a3b8';
                    dashAvatarMsg.style.display = 'block';

                    try {
                        const res = await window.localHireAPI.deleteAvatar();
                        if (res && res.success) {
                            dashAvatarMsg.textContent = 'Profile photo removed.';
                            dashAvatarMsg.style.color = '#10b981';
                            renderNavbar('navbar-container', 'pages');
                            refreshDashAvatar();
                        } else {
                            throw new Error(res?.message || 'Failed to remove photo.');
                        }
                    } catch (err) {
                        console.error('[Avatar Delete]', err);
                        dashAvatarMsg.textContent = err.message || 'Failed to remove photo.';
                        dashAvatarMsg.style.color = '#ef4444';
                    } finally {
                        dashBtnRemove.disabled = false;
                    }
                });
            }

            // Review dialog: a star rating and a written comment for one completed booking. Resolves true if a review was saved.
            const reviewDialog = ({ bookingId, workerName }) => new Promise((resolve) => {
                const PAY = window.LocalHirePayments; const E = PAY.esc;
                let rating = 0; let saved = false;
                const dlg = PAY.dialog(`<button class="pay-x" type="button" aria-label="Close" data-x>&times;</button>
                    <h3 id="pay-title">How was ${workerName ? E(workerName) : 'your professional'}?</h3>
                    <p class="pay-sub">Your review is public and shown with your first name and last initial. It cannot be edited or deleted afterwards, so please be accurate and respectful.</p>
                    <div class="rv-stars" role="radiogroup" aria-label="Your rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="false" aria-label="${n} star${n > 1 ? 's' : ''}" data-star="${n}">&#9733;</button>`).join('')}</div>
                    <small id="rv-label" class="pay-sub" aria-live="polite">Choose a rating</small>
                    <label class="pay-field"><span>Your review</span><textarea id="rv-text" maxlength="1000" placeholder="Was the professional on time, tidy and fairly priced? Did they fix the problem?"></textarea>
                    <small class="pay-sub" id="rv-count">0 / 1000 &middot; at least 10 characters</small></label>
                    <small id="rv-err" class="pay-sub" style="color:#b42318" role="alert"></small>
                    <div class="pay-actions"><button class="pay-btn ghost" type="button" data-x>Maybe later</button><button class="pay-btn primary" type="button" id="rv-go">Submit review</button></div>`, { onClose: () => resolve(saved) });
                const LABELS = ['Choose a rating', 'Poor', 'Fair', 'Good', 'Very good', 'Excellent'];
                const paint = () => { dlg.el.querySelectorAll('[data-star]').forEach((b) => { const n = Number(b.dataset.star); b.classList.toggle('on', n <= rating); b.setAttribute('aria-checked', String(n === rating)); }); const l = dlg.el.querySelector('#rv-label'); if (l) l.textContent = LABELS[rating]; };
                dlg.el.addEventListener('input', (ev) => { if (ev.target.id !== 'rv-text') return; dlg.el.querySelector('#rv-count').textContent = `${ev.target.value.length} / 1000 \u00b7 at least 10 characters`; dlg.el.querySelector('#rv-err').textContent = ''; });
                dlg.el.addEventListener('click', async (ev) => {
                    if (ev.target.closest('[data-x]')) return dlg.close('x');
                    const star = ev.target.closest('[data-star]');
                    if (star) { rating = Number(star.dataset.star); paint(); dlg.el.querySelector('#rv-err').textContent = ''; return; }
                    if (!ev.target.closest('#rv-go')) return;
                    const err = dlg.el.querySelector('#rv-err'); const text = dlg.el.querySelector('#rv-text').value.trim();
                    err.textContent = '';
                    if (!rating) { err.textContent = 'Please choose a star rating.'; return; }
                    if (text.length < 10) { err.textContent = 'Please write at least 10 characters about your experience.'; return; }
                    const go = dlg.el.querySelector('#rv-go'); go.disabled = true; go.textContent = 'Submitting\u2026';
                    const r = await window.localHireAPI.createReview(bookingId, rating, text);
                    if (r.success) {
                        saved = true;
                        dlg.set('<h3 id="pay-title">Thank you!</h3><p class="pay-sub">Your review was published and the professional has been notified.</p><div class="pay-actions"><button class="pay-btn primary" type="button" data-x autofocus>Done</button></div>');
                        return;
                    }
                    go.disabled = false; go.textContent = 'Submit review';
                    err.textContent = r.message || 'Your review could not be saved.';
                    if (r.code === 'ALREADY_REVIEWED') { saved = true; setTimeout(() => dlg.close('dup'), 1500); }
                });
                dlg.el.addEventListener('keydown', (ev) => {
                    const b = ev.target.closest && ev.target.closest('[data-star]'); if (!b) return;
                    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { rating = Math.min(5, (rating || 0) + 1); paint(); dlg.el.querySelector(`[data-star="${rating}"]`).focus(); ev.preventDefault(); }
                    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { rating = Math.max(1, (rating || 2) - 1); paint(); dlg.el.querySelector(`[data-star="${rating}"]`).focus(); ev.preventDefault(); }
                });
            });

            // Delegate booking action button clicks (accept with price, status changes, pay, confirm, dispute)
            const STATUS_CONFIRM = { CANCELLED: 'Cancel this booking? Any payment you made is refunded according to the cancellation rules.' };
            viewMyJobs.addEventListener('click', async (e) => {
                const el = e.target.closest('[data-act]');
                if (el) {
                    const PAY = window.LocalHirePayments;
                    const bookingId = el.getAttribute('data-booking-id');
                    const act = el.getAttribute('data-act');
                    const original = el.innerHTML;
                    const setBusy = (on) => { el.disabled = on; if (on) el.textContent = 'Please wait…'; else el.innerHTML = original; };
                    const report = async (text) => { await PAY.ask({ title: 'LocalHire', message: PAY.esc(text), confirmText: 'OK', cancelText: 'Close' }); };

                    if (act === 'pay') {
                        await PAY.openPayModal({ bookingId, onDone: () => window.location.reload() });
                        return;
                    }
                    if (act === 'accept') {
                        const price = await PAY.confirmPrice({ requestedPrice: Number(el.getAttribute('data-price') || 0) });
                        if (!price.confirmed) return;
                        setBusy(true);
                        const res = await window.localHireAPI.updateBookingStatus(bookingId, 'CONFIRMED', 'Accepted with confirmed price', { agreedPrice: price.price });
                        if (res && res.success) { window.location.reload(); return; }
                        setBusy(false);
                        await report(res && res.message ? res.message : 'Could not accept this booking.');
                        return;
                    }
                    if (act === 'reschedule') {
                        const dlg = PAY.dialog(`<button class="pay-x" type="button" aria-label="Close" data-x>&times;</button>
                            <h3 id="pay-title">Reschedule this booking</h3>
                            <p class="pay-sub">The customer is told the new time and the reason. If it does not suit them they can cancel.</p>
                            <label class="pay-field"><span>New date and time</span><input id="rs-when" type="datetime-local"></label>
                            <label class="pay-field"><span>Reason for the change</span><textarea id="rs-why" maxlength="300" placeholder="e.g. Another job is taking longer than planned"></textarea></label>
                            <div id="rs-err" class="pay-note err" role="alert" hidden></div>
                            <div class="pay-actions"><button class="pay-btn ghost" type="button" data-x>Cancel</button><button class="pay-btn primary" type="button" id="rs-go">Reschedule</button></div>`);
                        dlg.el.addEventListener('click', async (ev) => {
                            if (ev.target.closest('[data-x]')) return dlg.close('x');
                            if (!ev.target.closest('#rs-go')) return;
                            const when = dlg.el.querySelector('#rs-when').value; const why = dlg.el.querySelector('#rs-why').value.trim();
                            const err = dlg.el.querySelector('#rs-err');
                            if (!when) { err.hidden = false; err.textContent = 'Choose the new date and time.'; return; }
                            if (why.length < 3) { err.hidden = false; err.textContent = 'Please give the customer a short reason.'; return; }
                            const r = await PAY.call('PATCH', `/bookings/${encodeURIComponent(bookingId)}/reschedule`, { scheduledAt: new Date(when).toISOString(), reason: why });
                            if (r.ok) { dlg.close('ok'); window.location.reload(); } else { err.hidden = false; err.textContent = r.data.message || 'Could not reschedule.'; }
                        });
                        return;
                    }
                    if (act === 'complete') {
                        setBusy(true);
                        const r = await PAY.confirmCompletion({ bookingId, workerName: el.getAttribute('data-worker'), amountLabel: PAY.inr(el.getAttribute('data-amount')) });
                        if (r.done) { await reviewDialog({ bookingId, workerName: el.getAttribute('data-worker') }); window.location.reload(); return; }
                        setBusy(false);
                        if (!r.cancelled) await report(r.message);
                        return;
                    }
                    if (act === 'review') {
                        const saved = await reviewDialog({ bookingId, workerName: el.getAttribute('data-worker') });
                        if (saved) window.location.reload();
                        return;
                    }
                    if (act === 'dispute') {
                        const r = await PAY.reportProblem({ bookingId });
                        if (r.done) { await report(r.message); window.location.reload(); return; }
                        if (!r.cancelled) await report(r.message);
                        return;
                    }
                    if (act === 'status') {
                        const targetStatus = el.getAttribute('data-status');
                        const question = STATUS_CONFIRM[targetStatus];
                        if (question) {
                            const a = await PAY.ask({ title: 'Are you sure?', message: PAY.esc(question), confirmText: 'Yes, continue', cancelText: 'Keep booking', danger: targetStatus === 'CANCELLED' });
                            if (!a.confirmed) return;
                        }
                        setBusy(true);
                        const res = await window.localHireAPI.updateBookingStatus(bookingId, targetStatus);
                        if (res && res.success) { window.location.href = targetStatus === 'DISPATCHED' ? `track.html?booking=${encodeURIComponent(bookingId)}` : window.location.pathname + window.location.search; return; }
                        setBusy(false);
                        await report(res && res.message ? res.message : 'Could not update the booking.');
                        return;
                    }
                }

            });

            // Retrieve persistent bookings from backend (PostgreSQL / Prisma)
            const bookingRes = await window.localHireAPI.getMyBookings();
            const myBookings = (bookingRes && bookingRes.success) ? (bookingRes.bookings || []) : [];

            // Load jobs from the live backend instead of stale localStorage data so customer
            // and worker records match the PostgreSQL / Prisma database.
            const allJobs = await window.localHireAPI.getJobs();
            let myJobs = [];
            if (user.role === 'Worker') {
                // Workers see jobs assigned to their user ID or user name
                myJobs = allJobs.filter(j => j.assignedWorker === user.id || j.assignedWorker === user.name);
            } else {
                // Customers see jobs posted by them
                // Ownership comes from the server (isMine / customerId, sent only to the poster). Never match on a name: names are not unique.
                myJobs = allJobs.filter(j => j.isMine === true || j.customerId === user.id);
            }

            const totalCount = myBookings.length + myJobs.length;

            if (totalCount === 0) {
                viewMyJobs.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                        <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h3>${user.role === 'Worker' ? 'No active contracts yet' : 'No jobs or bookings found'}</h3>
                        <p class="text-muted" style="margin-bottom: 1.5rem;">${user.role === 'Worker' ? 'When a customer hires you, your assigned bookings and contracts will appear here.' : 'You do not have any active service bookings or requests.'}</p>
                        ${user.role === 'Customer' ? `<a href="search.html" class="btn btn-primary" style="margin-right: 0.5rem;">Find Workers</a><a href="post-job.html" class="btn btn-outline">Post a Job</a>` : `<a href="jobs.html" class="btn btn-primary">Browse Available Jobs</a>`}
                    </div>
                `;
                viewMyJobs.style.display = 'block';
            } else {
                viewMyJobs.innerHTML = '';

                // 1. Render Bookings (PostgreSQL / Prisma)
                myBookings.forEach(booking => {
                    viewMyJobs.innerHTML += createBookingCard(booking, user.role);
                });

                // Unread chat badges, deep-link highlight and the (quiet) browser-notification opt-in
                (async () => {
                    const N = window.LocalHireNotify;
                    if (!N) return;
                    const paintChat = (list) => list.forEach((c) => { const el = document.querySelector(`[data-chat-n="${CSS.escape(c.bookingId)}"]`); if (el) { el.hidden = !c.unreadCount; el.textContent = c.unreadCount > 9 ? '9+' : String(c.unreadCount); } });
                    const r = await N.call('GET', '/chat/conversations');
                    if (r.ok) paintChat(r.data.conversations);
                    N.on('chatUnread', async () => { const rr = await N.call('GET', '/chat/conversations'); if (rr.ok) paintChat(rr.data.conversations); });
                    const target = new URLSearchParams(window.location.search).get('booking');
                    const card = target && document.getElementById(`booking-${target}`);
                    if (card) { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); card.style.outline = '3px solid var(--primary)'; setTimeout(() => { card.style.outline = ''; }, 3000); }
                    N.maybeShowPushBanner(document.getElementById('push-banner'));
                })();

                // 2. Render Jobs (Job posts or assigned jobs)
                const jobsWithQuoteCounts = await Promise.all(myJobs.map(async (job) => {
                    let appCount = 0;
                    if (user.role === 'Customer') {
                        try {
                            const apps = await window.localHireAPI.getApplicationsForJob(job.id);
                            appCount = Array.isArray(apps) ? apps.length : 0;
                        } catch (error) {
                            appCount = 0;
                        }
                    }
                    return { ...job, appCount };
                }));

                jobsWithQuoteCounts.forEach(job => {
                    let cardHtml = createJobCard(job);
                    
                    if (user.role === 'Customer') {
                        const appCount = job.appCount || 0;
                        
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = cardHtml;
                        const cardDiv = wrapper.firstElementChild;
                        
                        let actionHtml = '';
                        if (job.status === 'In Progress') {
                            actionHtml = `
                                <div class="pay-status">
                                    <span class="pay-badge info">Professional hired</span>
                                    <div class="pay-hint">Pay, track and confirm completion on the booking card for this job.</div>
                                </div>
                            `;                        } else {
                            actionHtml = `
                                <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                    <button class="btn btn-outline view-quotes-btn" style="width: 100%; border-color: var(--primary); color: var(--primary);" data-job-id="${encodeURIComponent(job.id)}" data-job-title="${escapeHTML(job.title)}">
                                        View Quotes (${appCount})
                                    </button>
                                </div>
                            `;
                        }
                        cardDiv.innerHTML += actionHtml;
                        viewMyJobs.appendChild(cardDiv);
                    } else {
                        viewMyJobs.innerHTML += cardHtml;
                    }
                });
            }

            // Load Saved Workers (if Customer)
            if (user.role === 'Customer') {
                const users = window.localHireApp.getUsers();
                const freshUser = users.find(u => u.id === user.id) || { favorites: [] };
                const savedWorkers = Array.isArray(freshUser.favorites) ? freshUser.favorites : [];
                
                if (savedWorkers.length === 0) {
                    viewSaved.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                            <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <h3>No saved workers</h3>
                            <p class="text-muted" style="margin-bottom: 1.5rem;">Browse and save your favorite professionals for quick access later.</p>
                            <a href="search.html" class="btn btn-outline">Find Workers</a>
                        </div>
                    `;
                } else {
                    savedWorkers.forEach(workerId => {
                        const worker = window.localHireApp.getWorkerById(workerId);
                        if (worker) {
                            viewSaved.innerHTML += createWorkerCard(worker);
                        }
                    });
                }
            }

            // Customer Modal Logic
            if (user.role === 'Customer') {
                const modal = document.getElementById('customer-apps-modal');
                const closeBtn = document.getElementById('close-customer-apps');
                const modalTitle = document.getElementById('modal-job-title');
                const modalList = document.getElementById('modal-apps-list');

                // Bind View Quotes buttons using event delegation since they are added dynamically
                viewMyJobs.addEventListener('click', async (e) => {
                    const btn = e.target.closest('.view-quotes-btn');
                    if (btn) {
                        const jobId = btn.getAttribute('data-job-id');
                        const jobTitle = btn.getAttribute('data-job-title');
                        
                        modalTitle.textContent = `For: ${jobTitle}`;
                        modalList.innerHTML = '';
                        
                        const apps = await window.localHireAPI.getApplicationsForJob(jobId);
                        if (!apps || apps.length === 0) {
                            modalList.innerHTML = `<p class="text-muted" style="text-align: center; padding: 2rem;">No quotes received yet.</p>`;
                        } else {
                            apps.forEach(app => {
                                const safeWorkerName = escapeHTML(app.workerName || 'Worker');
                                const safeWorkerAvatar = app.workerAvatar ? escapeHTML(app.workerAvatar) : `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(app.workerName || 'worker')}`;
                                const safeMessage = escapeHTML(app.message || '');
                                const safeStatus = escapeHTML(app.status || 'Pending');
                                const safeQuote = Number(app.quote || 0);

                                modalList.innerHTML += `
                                    <div class="glass-card" style="padding: 1.5rem; background: var(--surface-light); border: 1px solid var(--border-light);">
                                        <div class="flex justify-between items-start" style="margin-bottom: 1rem;">
                                            <div class="flex items-center gap-3">
                                                <img src="${safeWorkerAvatar}" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary);">
                                                <div>
                                                    <h4 style="margin: 0; font-size: 1.1rem; color: var(--text-main);">${safeWorkerName}</h4>
                                                    <a href="profile.html?id=${encodeURIComponent(app.workerId)}" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">View Profile</a>
                                                </div>
                                            </div>
                                            <div class="flex flex-col items-end">
                                                <span style="font-size: 1.2rem; font-weight: bold; color: var(--secondary);">₹${safeQuote}</span>
                                                <span class="badge" style="margin-top: 0.25rem;">${safeStatus}</span>
                                            </div>
                                        </div>
                                        <p style="font-size: 0.95rem; margin: 0; color: var(--text-main); padding: 1rem; background: rgba(0,0,0,0.05); border-radius: 8px;">"${safeMessage}"</p>
                                        <div style="margin-top: 1rem; text-align: right;">
                                            <button class="btn btn-primary accept-quote-btn" data-app-id="${encodeURIComponent(app.id)}" data-job-id="${encodeURIComponent(jobId)}" style="padding: 0.5rem 1.25rem; font-size: 0.85rem;">
                                                Accept Quote & Hire
                                            </button>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        
                        modal.style.display = 'flex';
                    }
                });

                modalList.addEventListener('click', async (e) => {
                    const acceptBtn = e.target.closest('.accept-quote-btn');
                    if (acceptBtn) {
                        const jobId = acceptBtn.getAttribute('data-job-id');
                        const appId = acceptBtn.getAttribute('data-app-id');
                        const apps = await window.localHireAPI.getApplicationsForJob(jobId);
                        const app = Array.isArray(apps) ? apps.find(a => a.id === appId) : null;

                        modal.style.display = 'none';

                        const acceptResult = await window.localHireAPI.acceptQuote(appId);
                        if (!acceptResult || !acceptResult.success) {
                            await window.LocalHirePayments.ask({ title: 'Could not accept this quote', message: window.LocalHirePayments.esc((acceptResult && acceptResult.message) || 'Please try again.'), confirmText: 'OK', cancelText: 'Close' });
                            return;
                        }
                        if (acceptResult.bookingId) {
                            await window.LocalHirePayments.openPayModal({ bookingId: acceptResult.bookingId });
                        }
                        window.location.reload();
                    }
                });

                closeBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            // Load Applications (if Worker)
            if (user.role === 'Worker') {
                (async () => {
                    const viewAppsContainer = document.getElementById('apps-container');
                    const noApps = document.getElementById('no-apps');
                    
                    const myApps = await window.localHireAPI.getWorkerApplications();
                    if (!myApps || myApps.length === 0) {
                        viewAppsContainer.style.display = 'none';
                        noApps.style.display = 'block';
                    } else {
                        viewAppsContainer.style.display = 'grid';
                        noApps.style.display = 'none';
                        viewAppsContainer.innerHTML = '';
                        
                        const allJobs = await window.localHireAPI.getJobs();
                        
                        myApps.forEach(app => {
                            const job = allJobs.find(j => j.id === app.jobId);
                            if (job) {
                                viewAppsContainer.innerHTML += `
                                    <div class="glass-card flex-col gap-3">
                                        <div class="flex justify-between items-start">
                                            <h4 style="margin: 0; color: var(--primary);">${job.title}</h4>
                                            <span class="badge badge-primary">${app.status || 'Pending'}</span>
                                        </div>
                                        <p class="text-muted" style="margin: 0; font-size: 0.9rem;">Quote sent to the customer</p>
                                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-light);">
                                            <p style="margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--text-muted);">Your Quote</p>
                                            <p style="margin: 0; font-weight: bold; color: var(--secondary); font-size: 1.1rem;">${app.quote}</p>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }
                })();
            }
        });
    </script>
</body>
</html>

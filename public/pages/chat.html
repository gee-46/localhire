<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | LocalHire</title>
    <meta name="theme-color" content="#5b3df5">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/comm.css">
</head>
<body class="lh" style="padding-bottom:0">
    <div id="lh-header"></div>

    <main id="main" class="lh-main">
        <div class="cm-chat" id="chat" data-view="list">
            <section class="cm-side" aria-label="Conversations">
                <div class="cm-side-head"><span>Messages</span><span class="cm-badge" id="total-unread" hidden></span></div>
                <div class="cm-convs" id="convs" role="list"><div class="cm-skel"></div><div class="cm-skel"></div><div class="cm-skel"></div></div>
            </section>

            <section class="cm-main" aria-label="Conversation" id="thread-pane">
                <div id="thread-empty" class="cm-empty" style="margin:auto;border:0;background:none">
                    <h3>Select a conversation</h3>
                    <p>Every conversation is about one of your bookings. Open a booking and press <b>Chat</b> to start.</p>
                </div>
                <div id="thread" class="cm-thread" hidden>
                    <div class="cm-main-head">
                        <button type="button" class="cm-back" id="back" aria-label="Back to conversations">&larr;</button>
                        <div class="cm-av" id="h-av" aria-hidden="true"></div>
                        <div class="who"><strong id="h-name"></strong><small id="h-sub"></small></div>
                        <span class="cm-conn wait" id="conn" role="status" aria-live="polite">Connecting…</span>
                        <a class="cm-btn ghost" id="h-booking" href="my-jobs.html" style="min-height:36px;padding:0 12px;font-size:13px">Booking</a>
                    </div>
                    <div class="cm-msgs" id="msgs" role="log" aria-live="polite" aria-label="Messages" tabindex="0"></div>
                    <div class="cm-note" id="ro-note" hidden role="status"></div>
                    <form class="cm-compose" id="compose" autocomplete="off">
                        <label class="lh-sr" for="text">Type a message</label>
                        <textarea id="text" rows="1" maxlength="2000" placeholder="Type a message" enterkeyhint="send"></textarea>
                        <button type="submit" class="cm-btn primary cm-send" id="send">Send</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/geo.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/marketplace.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
    (async () => {
        const me = window.localHireApp.getCurrentUser();
        if (!me) { window.location.replace('auth.html'); return; }
        const N = window.LocalHireNotify;
        const $ = (s) => document.querySelector(s);
        LH.renderHeader($('#lh-header'), {});

        const chatEl = $('#chat');
        const MAX = 2000;
        let convs = []; let current = null; // current = { bookingId, messages[], hasMore, canSend, readOnlyReason, counterpart, booking }
        let reloadTimer = null; let wasConnected = false; let loadSeq = 0;

        // ── helpers ─────────────────────────────────────────────────────────
        const initials = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase() || '?';
        const avatar = (c, el) => { el.innerHTML = ''; if (c.avatarUrl && !/dicebear\.com/i.test(c.avatarUrl)) { const i = document.createElement('img'); i.src = c.avatarUrl; i.alt = ''; el.appendChild(i); } else el.textContent = initials(c.name); };
        const timeOf = (d) => new Date(d).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
        const dayKey = (d) => new Date(d).toDateString();
        const dayLabel = (d) => { const t = new Date(); const y = new Date(Date.now() - 86400000); const x = new Date(d); return x.toDateString() === t.toDateString() ? 'Today' : x.toDateString() === y.toDateString() ? 'Yesterday' : x.toLocaleDateString('en-IN', { dateStyle: 'medium' }); };
        const newClientId = () => `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
        const setView = (v) => { chatEl.dataset.view = v; };

        // ── conversation list ───────────────────────────────────────────────
        const drawConvs = () => {
            const box = $('#convs');
            const total = convs.reduce((a, c) => a + c.unreadCount, 0);
            $('#total-unread').hidden = !total; $('#total-unread').textContent = total > 99 ? '99+' : String(total);
            if (!convs.length) {
                box.innerHTML = `<div class="cm-empty" style="margin:16px;border:0"><h3>No conversations yet</h3><p>${me.role === 'Worker' ? 'When a customer messages you about a booking, it appears here.' : 'Message a professional from one of your bookings, and the conversation appears here.'}</p><p style="margin-top:12px"><a class="cm-btn primary" href="my-jobs.html">Go to my bookings</a></p></div>`;
                return;
            }
            box.innerHTML = '';
            convs.forEach((c) => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'cm-conv'; b.setAttribute('role', 'listitem'); b.dataset.id = c.bookingId;
                if (current && current.bookingId === c.bookingId) b.setAttribute('aria-current', 'true');
                const av = document.createElement('div'); av.className = 'cm-av'; avatar(c.counterpart, av);
                const n = document.createElement('div'); n.className = 'n'; n.textContent = c.counterpart.name;
                const t = document.createElement('div'); t.className = 't'; t.textContent = c.lastMessage ? (dayKey(c.timestamp) === new Date().toDateString() ? timeOf(c.timestamp) : dayLabel(c.timestamp)) : '';
                const p = document.createElement('div'); p.className = 'p' + (c.unreadCount ? ' unread' : '');
                p.textContent = `${c.lastMessage && c.lastMessage.senderId === me.id ? 'You: ' : ''}${c.lastMessage ? c.lastMessage.content : 'No messages yet'}`;
                const meta = document.createElement('div'); meta.className = 'p'; meta.style.gridColumn = '2'; meta.textContent = `${c.booking.bookingNumber} · ${c.booking.service}`;
                const badge = document.createElement('span'); badge.className = 'cm-badge'; badge.hidden = !c.unreadCount; badge.textContent = c.unreadCount > 99 ? '99+' : String(c.unreadCount);
                b.append(av, n, t, p, badge, meta);
                b.setAttribute('aria-label', `${c.counterpart.name}, booking ${c.booking.bookingNumber}${c.unreadCount ? `, ${c.unreadCount} unread` : ''}`);
                b.addEventListener('click', () => openThread(c.bookingId));
                box.appendChild(b);
            });
        };
        const loadConvs = async () => {
            const r = await N.call('GET', '/chat/conversations');
            if (!r.ok) { $('#convs').innerHTML = `<div class="cm-empty" role="alert" style="margin:16px"><h3>Could not load conversations</h3><p>${N.esc(r.data.message || 'Please try again.')}</p></div>`; return; }
            convs = r.data.conversations; drawConvs();
        };
        const reloadConvsSoon = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadConvs, 250); };

        // ── thread rendering ────────────────────────────────────────────────
        const bubble = (m) => {
            const mine = m.senderId === me.id;
            const el = document.createElement('div');
            el.className = `cm-b ${mine ? 'me' : 'them'}${m._state === 'failed' ? ' failed' : ''}`;
            el.dataset.key = m.clientMessageId || m.id;
            if (m.id) el.dataset.id = m.id;
            const text = document.createElement('div'); text.textContent = m.content; el.appendChild(text);
            const meta = document.createElement('div'); meta.className = 'meta';
            const when = document.createElement('span'); when.textContent = m._state === 'sending' ? 'Sending…' : (m._state === 'failed' ? 'Not sent' : timeOf(m.createdAt)); meta.appendChild(when);
            if (mine && !m._state) { const st = document.createElement('span'); st.className = 'st'; st.textContent = m.isRead ? '✓✓ Read' : '✓ Sent'; meta.appendChild(st); }
            if (m._state === 'failed') { const r = document.createElement('button'); r.type = 'button'; r.className = 'retry'; r.textContent = 'Retry'; r.addEventListener('click', () => deliver(m)); meta.appendChild(r); }
            el.appendChild(meta);
            return el;
        };
        const drawMessages = (keepScroll) => {
            const box = $('#msgs');
            const prevHeight = box.scrollHeight; const prevTop = box.scrollTop;
            const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
            box.innerHTML = '';
            if (current.hasMore) { const b = document.createElement('button'); b.type = 'button'; b.className = 'cm-btn ghost cm-more'; b.textContent = 'Load earlier messages'; b.addEventListener('click', loadEarlier); box.appendChild(b); }
            if (!current.messages.length) {
                const e = document.createElement('div'); e.className = 'cm-empty'; e.style.margin = 'auto';
                e.innerHTML = `<h3>No messages yet</h3><p>Say hello to ${N.esc(current.counterpart.name)} about booking ${N.esc(current.booking.bookingNumber)}.</p>`; box.appendChild(e);
            }
            let last = '';
            current.messages.forEach((m) => {
                const k = dayKey(m.createdAt);
                if (k !== last) { last = k; const d = document.createElement('div'); d.className = 'cm-day'; d.textContent = dayLabel(m.createdAt); box.appendChild(d); }
                box.appendChild(bubble(m));
            });
            if (keepScroll === 'preserve') box.scrollTop = prevTop + (box.scrollHeight - prevHeight);
            else if (keepScroll === 'bottom' || nearBottom) box.scrollTop = box.scrollHeight;
        };
        const drawHeader = () => {
            avatar(current.counterpart, $('#h-av'));
            $('#h-name').textContent = current.counterpart.name;
            $('#h-sub').textContent = `${current.counterpart.subtitle} · ${current.booking.bookingNumber} · ${String(current.booking.status).replace(/_/g, ' ').toLowerCase()}`;
            $('#h-booking').href = `my-jobs.html?booking=${encodeURIComponent(current.bookingId)}`;
            const note = $('#ro-note'); note.hidden = current.canSend; note.textContent = current.readOnlyReason || '';
            $('#text').disabled = !current.canSend; $('#send').disabled = !current.canSend;
            $('#text').placeholder = current.canSend ? 'Type a message' : 'Messages are closed for this booking';
        };

        // ── connection status ───────────────────────────────────────────────
        const paintConn = () => {
            const el = $('#conn'); const s = N.state.status;
            const map = { connected: ['Connected', 'ok'], connecting: ['Connecting…', 'wait'], reconnecting: ['Reconnecting…', 'wait'], offline: ['Offline', 'bad'], 'signed-out': ['Signed out', 'bad'], idle: ['Connecting…', 'wait'] };
            const [label, tone] = map[s] || map.idle; el.textContent = label; el.className = `cm-conn ${tone}`;
            if (s === 'signed-out') window.location.replace('auth.html');
        };
        N.on('status', paintConn); paintConn();

        // ── thread loading ──────────────────────────────────────────────────
        const emitAck = (event, data) => new Promise((resolve) => {
            const s = N.getSocket();
            if (!s || !s.connected) return resolve({ ok: false, error: 'offline' });
            s.timeout(6000).emit(event, data, (err, res) => resolve(err ? { ok: false, error: 'timeout' } : res));
        });
        const markRead = async () => {
            if (!current || document.visibilityState !== 'visible') return;
            const r = await emitAck('chat:read', { bookingId: current.bookingId });
            if (!r.ok) await N.call('POST', `/chat/bookings/${encodeURIComponent(current.bookingId)}/read`);
            const c = convs.find((x) => x.bookingId === current.bookingId); if (c) { c.unreadCount = 0; drawConvs(); }
            N.refreshCounts();
        };
        const joinRoom = async () => { if (current) await emitAck('chat:join', { bookingId: current.bookingId }); };

        async function openThread(bookingId) {
            const mine = ++loadSeq;
            if (current && N.getSocket()) N.getSocket().emit('chat:leave', { bookingId: current.bookingId });
            setView('thread'); $('#thread-empty').hidden = true; $('#thread').hidden = false;
            $('#msgs').innerHTML = '<div class="cm-skel"></div><div class="cm-skel"></div><div class="cm-skel"></div>';
            current = null; drawConvs();
            const r = await N.call('GET', `/chat/bookings/${encodeURIComponent(bookingId)}/messages?limit=50`);
            if (mine !== loadSeq) return;
            if (!r.ok) {
                $('#h-name').textContent = 'Conversation unavailable'; $('#h-sub').textContent = ''; $('#h-av').textContent = '!';
                $('#msgs').innerHTML = `<div class="cm-empty" role="alert" style="margin:auto"><h3>${r.status === 403 || r.status === 404 ? 'You can\'t open this conversation' : 'Could not load messages'}</h3><p>${N.esc(r.data.message || 'Please try again.')}</p></div>`;
                $('#text').disabled = true; $('#send').disabled = true; $('#ro-note').hidden = true;
                return;
            }
            current = { bookingId, messages: r.data.messages, hasMore: r.data.hasMore, canSend: r.data.canSend, readOnlyReason: r.data.readOnlyReason, counterpart: r.data.counterpart, booking: r.data.booking };
            history.replaceState(null, '', `chat.html?booking=${encodeURIComponent(bookingId)}`);
            drawHeader(); drawMessages('bottom'); drawConvs();
            await joinRoom(); markRead();
            if (!/Mobi|Android/i.test(navigator.userAgent)) $('#text').focus();
        }

        async function loadEarlier() {
            if (!current || !current.messages.length) return;
            const r = await N.call('GET', `/chat/bookings/${encodeURIComponent(current.bookingId)}/messages?limit=50&before=${encodeURIComponent(current.messages.find((m) => m.createdAt).createdAt)}`);
            if (!r.ok) return;
            current.messages = r.data.messages.concat(current.messages); current.hasMore = r.data.hasMore; drawMessages('preserve');
        }

        // merge a server message into the thread without ever duplicating it
        const merge = (m) => {
            if (!current || m.bookingId !== current.bookingId) return false;
            const i = current.messages.findIndex((x) => x.id === m.id || (m.clientMessageId && x.clientMessageId === m.clientMessageId));
            if (i >= 0) current.messages[i] = { ...current.messages[i], ...m, _state: undefined };
            else current.messages.push(m);
            current.messages.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            return i < 0;
        };

        // ── sending ─────────────────────────────────────────────────────────
        async function deliver(m) {
            m._state = 'sending'; drawMessages('bottom');
            const payload = { bookingId: current.bookingId, content: m.content, clientMessageId: m.clientMessageId };
            let res = await emitAck('chat:send', payload);
            if (!res.ok && (res.error === 'offline' || res.error === 'timeout')) {
                // no live connection: the REST route is idempotent on clientMessageId, so retrying is always safe
                const r = await N.call('POST', `/chat/bookings/${encodeURIComponent(current.bookingId)}/messages`, { content: m.content, clientMessageId: m.clientMessageId });
                res = r.ok ? { ok: true, message: r.data.message } : { ok: false, error: r.data.message || 'Network problem. Check your connection and retry.' };
            }
            if (!current) return;
            if (res.ok) { merge(res.message); } else { m._state = 'failed'; m._error = res.error; }
            drawMessages('bottom'); reloadConvsSoon();
        }

        $('#compose').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!current || !current.canSend) return;
            const ta = $('#text'); const content = ta.value.trim();
            if (!content || content.length > MAX) return;
            const m = { id: null, clientMessageId: newClientId(), bookingId: current.bookingId, senderId: me.id, content, createdAt: new Date().toISOString(), isRead: false, _state: 'sending' };
            current.messages.push(m); ta.value = ''; ta.style.height = 'auto'; ta.focus();
            deliver(m);
        });
        $('#text').addEventListener('keydown', (e) => {
            const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); $('#compose').requestSubmit(); }
        });
        $('#text').addEventListener('input', (e) => { const t = e.target; t.style.height = 'auto'; t.style.height = `${Math.min(140, t.scrollHeight)}px`; });
        $('#back').addEventListener('click', () => { setView('list'); history.replaceState(null, '', 'chat.html'); });

        // ── live events ─────────────────────────────────────────────────────
        const wire = (socket) => {
            socket.on('chat:message', (m) => {
                const added = merge(m);
                if (current && m.bookingId === current.bookingId) { drawMessages(); if (added && m.senderId !== me.id) markRead(); }
                reloadConvsSoon();
            });
            socket.on('chat:read', (e) => {
                if (!current || e.bookingId !== current.bookingId || e.readerId === me.id) return;
                current.messages.forEach((m) => { if (m.senderId === me.id) { m.isRead = true; } });
                drawMessages();
            });
            socket.on('chat:unread', () => reloadConvsSoon());
            socket.on('conversation:updated', () => reloadConvsSoon());
        };
        let wired = null;
        const attach = async () => {
            const s = await N.connect();
            if (s && wired !== s) { wired = s; wire(s); }
        };
        // After a (re)connect the server has forgotten our room: join again and fetch whatever we missed.
        N.on('connected', async () => {
            if (wasConnected && current) {
                await joinRoom();
                const lastServer = [...current.messages].reverse().find((m) => m.id);
                if (lastServer) {
                    const r = await N.call('GET', `/chat/bookings/${encodeURIComponent(current.bookingId)}/messages?after=${encodeURIComponent(lastServer.createdAt)}`);
                    if (r.ok) { r.data.messages.forEach(merge); drawMessages(); markRead(); }
                }
                // anything still marked "sending"/"failed" can be retried safely
                current.messages.filter((m) => m._state === 'failed').forEach(deliver);
            }
            wasConnected = true; reloadConvsSoon();
        });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') markRead(); });

        // ── start ───────────────────────────────────────────────────────────
        await attach();
        await loadConvs();
        const params = new URLSearchParams(window.location.search);
        let target = params.get('booking');
        if (!target && params.get('userId')) {
            // older links: resolve to the latest real booking with that person
            const r = await N.call('GET', `/chat/user/${encodeURIComponent(params.get('userId'))}`);
            if (r.ok && r.data.bookingId) target = r.data.bookingId;
            else { $('#thread-empty').innerHTML = '<h3>No booking with this person yet</h3><p>Conversations are tied to a booking. Request a booking first, then you can message each other about it.</p>'; }
        }
        if (target) await openThread(target);
        else if (convs.length && window.matchMedia('(min-width: 820px)').matches) await openThread(convs[0].bookingId);
    })();
    </script>
</body>
</html>
